<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="640" height="400">
  <defs>
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
    <linearGradient id="chipGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="100%" stop-color="#ca8a04"/>
    </linearGradient>
  </defs>

  <!-- Card Body -->
  <rect width="640" height="400" rx="24" fill="url(#cardBg)" stroke="#bae6fd" stroke-width="4"/>

  <!-- Guilloche / Watermark Pattern Lines -->
  <path d="M 0 80 Q 160 40 320 80 T 640 80" stroke="rgba(255,255,255,0.15)" stroke-width="2" fill="none"/>
  <path d="M 0 140 Q 160 100 320 140 T 640 140" stroke="rgba(255,255,255,0.12)" stroke-width="2" fill="none"/>
  <path d="M 0 200 Q 160 160 320 200 T 640 200" stroke="rgba(255,255,255,0.1)" stroke-width="2" fill="none"/>
  <path d="M 0 260 Q 160 220 320 260 T 640 260" stroke="rgba(255,255,255,0.12)" stroke-width="2" fill="none"/>
  <path d="M 0 320 Q 160 280 320 320 T 640 320" stroke="rgba(255,255,255,0.15)" stroke-width="2" fill="none"/>

  <!-- Card Header -->
  <text x="320" y="42" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle" letter-spacing="1.5">REPUBLIK INDONESIA</text>
  <text x="320" y="66" font-family="Arial, sans-serif" font-size="20" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="2">PROVINSI DKI JAKARTA</text>

  <!-- Chip & NFC Symbol -->
  <rect x="40" y="85" width="56" height="44" rx="8" fill="url(#chipGrad)" stroke="#a16207" stroke-width="1.5"/>
  <line x1="40" y1="107" x2="96" y2="107" stroke="#854d0e" stroke-width="1.5"/>
  <line x1="68" y1="85" x2="68" y2="129" stroke="#854d0e" stroke-width="1.5"/>

  <!-- NIK -->
  <text x="40" y="160" font-family="monospace, monospace" font-size="14" font-weight="bold" fill="#f8fafc">NIK</text>
  <text x="140" y="160" font-family="monospace, monospace" font-size="20" font-weight="bold" fill="#ffffff" letter-spacing="2">: 3171011708020001</text>

  <!-- Data Fields -->
  <g font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#f0fdf4">
    <text x="40" y="195">Nama</text>
    <text x="140" y="195" fill="#ffffff">: RAFI ERBAKTI</text>

    <text x="40" y="225">Tempat/Tgl Lahir</text>
    <text x="140" y="225" fill="#ffffff">: JAKARTA, 17-08-2002</text>

    <text x="40" y="255">Jenis Kelamin</text>
    <text x="140" y="255" fill="#ffffff">: LAKI-LAKI</text>

    <text x="40" y="285">Alamat</text>
    <text x="140" y="285" fill="#ffffff">: JL. MARGONDA RAYA NO. 100</text>

    <text x="60" y="310">RT/RW</text>
    <text x="140" y="310" fill="#ffffff">: 004 / 007</text>

    <text x="60" y="335">Kel/Desa</text>
    <text x="140" y="335" fill="#ffffff">: PONDOK CINA, KEC. BEJI</text>

    <text x="40" y="365">Agama</text>
    <text x="140" y="365" fill="#ffffff">: ISLAM</text>

    <text x="40" y="388">Status Perkawinan</text>
    <text x="140" y="388" fill="#ffffff">: BELUM KAWIN</text>
  </g>

  <!-- Photo Box -->
  <rect x="470" y="110" width="130" height="175" rx="12" fill="#1e293b" stroke="#ffffff" stroke-width="3"/>
  <rect x="473" y="113" width="124" height="169" rx="10" fill="#dc2626"/>
  <!-- Portrait Avatar inside KTP -->
  <circle cx="535" cy="170" r="38" fill="#fde047"/>
  <path d="M 495 260 C 500 215, 570 215, 575 260 Z" fill="#1e3a8a"/>
  <circle cx="535" cy="165" r="28" fill="#fed7aa"/>
  <path d="M 515 155 Q 535 130 555 155 Q 535 142 515 155 Z" fill="#0f172a"/>

  <!-- Verified Stamp Badge -->
  <g transform="translate(460, 290)">
    <rect width="150" height="34" rx="8" fill="#059669" stroke="#ffffff" stroke-width="1.5"/>
    <text x="75" y="22" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle" letter-spacing="1">✓ e-KTP TERVERIFIKASI</text>
  </g>
  <text x="535" y="348" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">BERLAKU SEUMUR HIDUP</text>
</svg>
